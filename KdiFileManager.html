:root{--bg:#0000a8;--dk:#000070;--gy:#a8a8a8;--cy:#54fcfc;--ye:#fcfc54;--tl:#00a8a8;--rd:#a80000;--mg:#a800a8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0000a8 repeating-conic-gradient(#0000a8 0 25%,#0000b6 0 50%) 0 0/4px 4px;color:var(--cy);font:16px/18px Clacon,"Perfect DOS VGA 437","Px437 IBM VGA8","Lucida Console","Courier New",monospace;font-synthesis:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
.mb{background:var(--gy);color:#000;display:flex;white-space:nowrap;overflow-x:auto;flex:none}.mi{padding:1px 12px;cursor:pointer}.mi b,.dd b{color:var(--rd);font-weight:400}.mi.o{background:#000;color:#fff}.mi.o b{color:var(--ye)}.sp{flex:1}.mb a{color:#000}
.win{flex:1;min-height:0;margin:14px 16px 10px;border:3px double #fff;background:var(--bg);box-shadow:8px 8px 0 #000;display:flex;flex-direction:column;position:relative}
.wt{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gy);color:#000;padding:0 10px;white-space:nowrap;max-width:90%;overflow:hidden}
.sb{flex:none;background:var(--gy);color:#000;padding:1px 8px;display:flex;justify-content:space-between;gap:16px;white-space:nowrap;overflow-x:auto;font-size:14px}
button,.bt{font:inherit;background:var(--gy);color:#000;border:0;box-shadow:2px 2px 0 #000;padding:1px 9px;cursor:pointer;white-space:nowrap;margin:0 2px 2px 0}
button:hover:not(:disabled),.bt:hover{background:var(--ye)}button:disabled{color:#686868;box-shadow:none;cursor:default}
.bt b{color:var(--rd);font-weight:400}.sg{display:inline-flex}.sg .bt{box-shadow:none;margin:0}.bt.on,.sg .bt.on{background:#000;color:#fff}
.tbr{display:flex;gap:6px;padding:5px 8px;overflow-x:auto;flex:none;align-items:center;background:var(--tl);color:#000}
.tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none}.tab.on{background:var(--tl)}
select,input,textarea{font:inherit;background:#000;color:#fff;border:1px solid var(--gy);padding:1px 4px;accent-color:var(--ye)}
input[type=checkbox]{width:15px;height:15px;vertical-align:middle}
.tw{flex:1;overflow:auto;min-height:0;padding:6px 8px}
table{border-collapse:collapse;width:100%}th{color:var(--ye);text-align:left;position:sticky;top:-6px;background:var(--bg);border-bottom:1px solid var(--cy)}td,th{padding:1px 10px;white-space:nowrap}
tr[data-id]:hover{background:var(--dk)}tr.mk td{background:#004a6a}.tw{outline:0}.dd .hl,.cm .hl{background:#000;color:#fff}.map span.mc{outline:2px solid #fff;outline-offset:1px}pre .c2{outline:1px solid var(--ye)}a,a:visited{color:#ffee45;text-decoration:underline}a:hover{color:#fff}tr.cur td{background:#a8a8a8!important;color:#000!important}th[data-sort]{cursor:pointer}.rep{white-space:pre-wrap;padding:6px 10px}.rep h3{color:var(--ye)}pre .f{background:#fc54fc;color:#000}pre i.h,pre u.h{color:#fc5454}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:30}.bx{background:var(--gy);color:#000;border:3px double #fff;box-shadow:8px 8px 0 #000;padding:14px 18px;max-width:90vw}.bx input,.bx select{width:100%;margin-bottom:8px}.bx button{background:var(--tl)}
.dd,.cm{position:fixed;background:var(--gy);color:#000;box-shadow:6px 6px 0 #000;border:2px solid #000;z-index:20;min-width:230px}.dd{top:calc(22px + env(safe-area-inset-top,0px))}
.dd div,.cm div{padding:2px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:20px;white-space:nowrap}.dd div:hover,.cm div:hover{background:#000;color:#fff}.dis{color:#686868!important;cursor:default!important}.dd i,.cm i{font-style:normal;color:var(--rd)}
.st{margin:auto;text-align:center}.st h1{color:var(--ye)}
.vt{padding:2px 8px;color:var(--ye);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vb{flex:1;overflow:auto;min-height:0;padding:2px 8px}
.vb textarea{width:100%;height:100%;resize:none}
pre{margin:4px 0;outline:0}pre div{white-space:pre}pre b{color:var(--ye);margin-right:8px;font-weight:400}pre i,pre em,pre u{font-style:normal;text-decoration:none}pre em{margin-left:10px;color:#fff}pre .c{background:var(--ye);color:#000}pre i,pre u{cursor:pointer}
.map{display:flex;flex-wrap:wrap;gap:2px}.map span{width:16px;height:16px;border:1px solid #000;cursor:pointer;background:var(--dk)}
.lg span{display:inline-block;margin-right:12px}.lg i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:middle;font-style:normal}
.w{color:#fc5454}.dim{color:var(--gy)}input.hv{width:7em}

function bfl(b,p,n){const e=b[p+n-1];if(!e)return'0';let f=0;for(let i=n-2;i>=0;i--)f+=(i==n-2?(b[p+i]&127|128):b[p+i])/256**(n-1-i);const v=f*2**(e-128)*(b[p+n-2]&128?-1:1);return String(+v.toPrecision(n==4?7:15))}
function decBas(b){const L=[],ch=c=>c<32?'\\x'+hx(c):S.dec[c];let p=1,unk=0;if(b[0]!=0xFF)return null;
 while(p+4<=b.length){if(!(b[p]|b[p+1]<<8))break;let s=(b[p+2]|b[p+3]<<8)+' ';p+=4;
  while(p<b.length&&b[p]){const c=b[p++];
   if(c==0x22){s+='"';while(p<b.length&&b[p]&&b[p]!=0x22)s+=ch(b[p++]);if(b[p]==0x22){s+='"';p++}}
   else if(c==0x0E){s+=b[p]|b[p+1]<<8;p+=2}else if(c==0x0F)s+=b[p++];else if(c>=0x11&&c<=0x1A)s+=c-0x11;
   else if(c==0x1C){const v=b[p]|b[p+1]<<8;s+=v>32767?v-65536:v;p+=2}
   else if(c==0x0B){s+='&O'+(b[p]|b[p+1]<<8).toString(8);p+=2}else if(c==0x0C){s+='&H'+(b[p]|b[p+1]<<8).toString(16).toUpperCase();p+=2}
   else if(c==0x1D){s+=bfl(b,p,4);p+=4}else if(c==0x1F){s+=bfl(b,p,8);p+=8}
   else if(c==BAS_PREFIX){const c2=b[p++];s+=TOK2[c2]||(unk++,'[FF'+hx(c2)+']')}
   else if(c>=0x80){const w=TOK[c];if(!w)unk++;s+=w||'['+hx(c)+']';if(w=='REM'||w=="'")while(b[p])s+=ch(b[p++]);else if(w=='DATA')while(b[p]&&b[p]!=0x3A)s+=ch(b[p++])}
   else s+=c<32?'<'+hx(c)+'>':String.fromCharCode(c)}
  p++;L.push(s)}
 return{text:L.join('\n'),unk}}

const HELP=`<h3>KDI disk image format (Korvet, CP/M 2.2)</h3>
<p>Sources: <b>[xK]</b> comments and code of the xKorvet utility (S. Erokhin, 2002-3); <b>[CPM]</b> CP/M 2.2 Alteration Guide ch. 6 (Digital Research) and the seasip.info page "CP/M 2.2 disc formats"; <b>[obs]</b> checked on real system-track samples. All numbers are little-endian. "Record" = 128 bytes.</p>
<h4>1. Overall layout</h4>
<p>A KDI file is a raw linear dump with no container header. Its first 32 bytes are the DSKINFO record; they lie inside the system area. [xK]</p>
<pre>
file offset 0 .............. system area: OFS tracks (DSKINFO = first 32 bytes, then boot code)
file offset SYS ............ data block 0 (= start of the directory)
file offset SYS+n*BLK ...... data block n,  n = 0 .. DSM

SecBytes = 128 &lt;&lt; SecSize                 (0:128  1:256  2:512  3:1024)
SYS      = OFS * SecPerTrack * SecBytes     (system area size in bytes)
BLK      = (BLM+1) * 128                    (data block size; xKorvet hard-codes 2 sectors)
image    = TrkPerDisk * (InSide ? 2 : 1) * SecPerTrack * SecBytes
           (any bytes after block DSM are unused)
</pre>
<h4>2. DSKINFO record (32 bytes at file offset 0) [xK]</h4>
<table><tr><th>off</th><th>size</th><th>field</th><th>meaning</th></tr>
<tr><td>0</td><td>2</td><td>LoadAddr</td><td>memory address where the boot loader puts the system</td></tr>
<tr><td>2</td><td>2</td><td>RunAddr</td><td>address where control goes after loading</td></tr>
<tr><td>4</td><td>2</td><td>Count</td><td>number of physical sectors to load</td></tr>
<tr><td>6</td><td>1</td><td>SizeDisk</td><td>1 = 8", 0 = 5.25"</td></tr>
<tr><td>7</td><td>1</td><td>Density</td><td>0 = FM, 1 = MFM</td></tr>
<tr><td>8</td><td>1</td><td>TpI</td><td>0 = 48, 1 = 96, 2 = 135 tracks per inch</td></tr>
<tr><td>9</td><td>1</td><td>Skew</td><td>1 = no sector translation; otherwise the size of a translation table stored in bytes 33..128 of the info sector</td></tr>
<tr><td>10</td><td>1</td><td>SecSize</td><td>physical sector: 0=128, 1=256, 2=512, 3=1024 bytes</td></tr>
<tr><td>11</td><td>1</td><td>InSide</td><td>0 = one side, 1 = two sides</td></tr>
<tr><td>12</td><td>2</td><td>SecPerTrack</td><td>physical sectors per track</td></tr>
<tr><td>14</td><td>2</td><td>TrkPerDisk</td><td>tracks per side</td></tr>
<tr><td colspan=4>From here on it is the CP/M Disk Parameter Block (DPB) [CPM]:</td></tr>
<tr><td>16</td><td>2</td><td>SPT</td><td>128-byte records per track = SecPerTrack * SecBytes / 128</td></tr>
<tr><td>18</td><td>1</td><td>BSH</td><td>block shift = log2(BLK/128)</td></tr>
<tr><td>19</td><td>1</td><td>BLM</td><td>block mask = BLK/128 - 1 = 2^BSH - 1</td></tr>
<tr><td>20</td><td>1</td><td>EXM</td><td>extent mask: 2^(BSH-3)-1 if DSM&lt;256, else 2^(BSH-4)-1 (xKorvet: BLK/1024 - 1 - DSM/256)</td></tr>
<tr><td>21</td><td>2</td><td>DSM</td><td>number of data blocks - 1</td></tr>
<tr><td>23</td><td>2</td><td>DRM</td><td>number of directory entries - 1</td></tr>
<tr><td>25</td><td>1</td><td>AL0</td><td>bitmap of blocks reserved for the directory; bit 7 of AL0 = block 0, bit 0 of AL0 = block 7</td></tr>
<tr><td>26</td><td>1</td><td>AL1</td><td>continuation: bit 7 of AL1 = block 8 ... bit 0 = block 15</td></tr>
<tr><td>27</td><td>2</td><td>CKS</td><td>checksum vector size = (DRM+1)/4, 0 for a fixed disk</td></tr>
<tr><td>29</td><td>2</td><td>OFS</td><td>CP/M "OFF": number of reserved (system) tracks</td></tr>
<tr><td>31</td><td>1</td><td>CRC</td><td>(0x66 + sum of bytes 0..30) &amp; 0xFF</td></tr></table>
<p><b>Worked example</b> [obs] (CPM-NIIYAF system track, first 32 bytes):</p>
<pre>
00 00 00 00 0E 00 00 01 01 01 03 01 05 00 50 00 28 00 04 0F 00 87 01 7F 00 C0 00 20 00 02 00 F4
LoadAddr=0 RunAddr=0 Count=14 SizeDisk=0 Density=1 TpI=1 Skew=1 SecSize=3 (1024) InSide=1
SecPerTrack=5 TrkPerDisk=80 SPT=40 BSH=4 BLM=15 EXM=0 DSM=391 DRM=127 AL0=C0 AL1=00
CKS=32 OFS=2 CRC=F4  (0x66 + sum of the first 31 bytes = ...F4, so the CRC is valid)
SYS = 2*5*1024 = 10240   BLK = 16*128 = 2048   directory = 128*32 = 4096 B = 2 blocks (AL0=C0: blocks 0,1)
</pre>
<h4>3. Directory</h4>
<p>It starts at data block 0 and has DRM+1 entries of 32 bytes. Entries are stored in one contiguous run (the AL0/AL1 blocks). [xK][CPM]</p>
<table><tr><th>off</th><th>size</th><th>field</th><th>meaning</th></tr>
<tr><td>0</td><td>1</td><td>UU</td><td>user area. 0..15 normally; Korvet disks may use any value 0..0xE4. 0xE5 = empty or deleted entry</td></tr>
<tr><td>1</td><td>8</td><td>F1..F8</td><td>name, upper case, padded with spaces; bit 7 is not part of the name</td></tr>
<tr><td>9</td><td>3</td><td>T1..T3</td><td>extension, padded with spaces; bit 7 of T1 = read-only, bit 7 of T2 = system [CPM]</td></tr>
<tr><td>12</td><td>1</td><td>EX</td><td>extent number, low part (0..31)</td></tr>
<tr><td>13</td><td>1</td><td>S1</td><td>reserved, 0 (xKorvet reads S1+S2 as one word "Extent2")</td></tr>
<tr><td>14</td><td>1</td><td>S2</td><td>extent number, high part</td></tr>
<tr><td>15</td><td>1</td><td>RC</td><td>records (128 B) used in this extent, 0..128</td></tr>
<tr><td>16</td><td>16</td><td>blocks</td><td>8 block numbers of 2 bytes each (used when DSM &gt;= 256); 0 = not used</td></tr></table>
<p>A freshly formatted directory is filled with 0xE5 bytes. A deleted file keeps its entries; only UU is set to 0xE5, so the file can be restored while its blocks are not reused.</p>
<h4>4. Files, extents, sizes</h4>
<p>A file is the set of live entries (UU != 0xE5) with the same user, name and extension. Order them by extent number N = 32*S2 + EX. [CPM] With EXM = 0 (the usual Korvet case) one entry = one extent = up to 8 blocks = up to 128 records. In an entry, the first ceil(RC*128 / BLK) pointers are valid. The file size is the sum of RC*128 over all its entries. CP/M 2.2 stores no byte length: text files end with ^Z (0x1A) and are padded with it; other files are a multiple of 128 bytes. Bytes of the last block beyond RC*128 are unused.</p>
<p>General rule for EXM &gt; 0 [CPM]: directory entry index = N / (EXM+1); records in the entry = (EX &amp; EXM) * 128 + RC. This is not implemented in xKorvet or in this program.</p>
<h4>5. How to read a file (algorithm)</h4>
<pre>
1. read 32 bytes at offset 0; check CRC; derive SecBytes, SYS, BLK from section 1
2. read (DRM+1)*32 bytes at offset SYS = directory
3. for each entry with UU != 0xE5: key = (UU, name, ext)  -> list of entries
4. sort the entries of a key by 32*S2 + EX
5. for each entry: remaining = RC*128
      for i in 0..7 while remaining > 0:
         n = word at entry+16+2*i ; take min(remaining, BLK) bytes from offset SYS + n*BLK
         remaining -= BLK
6. concatenate -> file content (length = sum of RC*128)
</pre>
<h4>6. Allocation (for writers)</h4>
<p>Block n is used if some live entry points to it, or if it is reserved for the directory (AL0/AL1 bit n, counted from the MSB of AL0). Every other block is free. A new file takes free blocks, 8 per entry: entry k gets EX = k mod 32, S2 = k div 32, RC = min(128, records left). An empty file is one entry with RC = 0. Check before writing: the directory has enough free entries (UU = 0xE5), and (DRM+1)*32 &lt;= (blocks in AL) * BLK.</p>
<h4>7. Consistency checks used by this program</h4>
<p>CRC; SYS fits in the file; SYS + (DSM+1)*BLK fits in the file; BLM = 2^BSH-1; SPT matches the geometry; EXM and CKS match their formulas; EX &lt;= 31; RC &lt;= 128; block pointers &lt;= DSM; no block used by two files (crosslink); no pointers beyond RC; extent numbers without gaps or duplicates.</p>
<h4>8. Not covered / unverified</h4>
<p><b>Skew</b> &gt; 1: [xK] says a translation table is stored in the info sector, but neither xKorvet nor this program applies it. <b>Sides</b>: [xK] says logical even tracks are on side 0 and odd ones on side 1; both tools treat the file as a plain linear sequence, so images in another order are not handled. <b>DSM &lt; 256</b> (1-byte pointers) and <b>EXM &gt; 0</b> are not supported. The meanings of SizeDisk, Density and TpI come only from the xKorvet comments.</p>
<p>References: <a href="https://www.seasip.info/Cpm/format22.html" target=_blank>seasip.info/Cpm/format22.html</a>, <a href="https://www.icl1900.co.uk/unix4fun/z80pack/cpm2/ch6.htm" target=_blank>CP/M 2.2 Alteration Guide, ch. 6</a>.</p>
`;
const KEYS=`<h3>Keys and viewers</h3>
<p><b>Menu keys</b>: M or F10, then the menu digit, then the item digit (e.g. M 1 2 = Image / Open). Help is menu 0. Arrows, Enter and Esc also work in menus. Shift+F10 or the Menu key opens the context menu.</p>
<p><b>Catalog</b>: arrows/Home/End/PgUp/PgDn move the cursor, Space marks, + all, - none, * invert, Ctrl+A all. F3 or Enter = view. F2 rename, F5 copy to USER, Shift+F5 double, F6 move, F7 extract, F8 erase, F9 restore, Ins add host files, U cycles the USER filter, S cycles the sort column (Shift+S reverses). Double click = view.</p>
<p><b>Viewer</b>: F2 save, F3 switch HEX/TEXT (HEX/ASCII/BASIC for tokenized BASIC), F4 VIEW/EDIT, F8 code page, F7 or Ctrl+F search (Shift+F7 backwards), Ctrl+G go to offset, Tab switches hex/ascii pane, Ctrl+Z undo (hex), Esc back. <b>Map</b>: arrows move, Enter opens the block.</p>
<p><b>BASIC view</b>: MBASIC-style tokenized files start with 0xFF (0xFE = protected, not decoded). Line = next-address(2), line number(2), tokens, 0x00. Numeric constants: 0x0E line number, 0x0F byte, 0x11-0x1A digits 0-9, 0x1C int16, 0x1D single, 0x1F double. The token table is only partly verified; edit TOK in the source.</p>
<p><b>Host file names</b>: bytes outside [A-Za-z0-9_-$!#&amp;@^~(){}'] and the percent sign are written as %XX (hex). A non-zero USER is prefixed as NN%5C (i.e. NN\). Dropped host files are converted to 8.3 (Cyrillic transliterated).</p>
`;
